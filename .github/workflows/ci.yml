name: CI

# Nothing in this repo has ever been checked automatically.
#
# The six offline suites under functions/test/ have been run by hand, which
# means they have only ever run when somebody remembered — and the ones that
# matter most are exactly the ones written to fail quietly in the background:
# service-facts.test.mjs exists to go red when a pricing formula drifts into a
# module the /search overview reads, and nobody would find out until a customer
# was quoted a number we do not honour.
#
# A guard nobody watches fail is a guard nobody knows works.
#
# Runs on pull_request, where GitHub checks out the MERGE RESULT rather than
# the branch tip. That is the point: the numbers here describe the tree that
# will exist after merging, which is precisely what a local run on a stale base
# cannot promise (see the pre-push hook and the branch-base rule in CLAUDE.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  admin-app:
    name: Admin app (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci

      # ADVISORY, NOT A GATE — and that is a decision, not an oversight.
      #
      # The first run of this workflow reported 1,109 problems (1,095 errors),
      # every one of them pre-existing: `no-explicit-any` across the whole app
      # plus a handful of unused imports. None came from the change being
      # tested. Made blocking, this check would be red on every PR from the day
      # it was added, which is worse than having no check: a gate that is
      # always red teaches everyone to merge past red, and then the day the
      # types or the tests break, nobody looks.
      #
      # It still runs, because the output is worth reading and because the
      # count is the thing to ratchet down. Turn it blocking when it reaches
      # zero — not before.
      - name: Lint (advisory)
        continue-on-error: true
        run: npm run lint

      # These two DO gate. Both are clean today, so red here means the change
      # under test broke something.
      #
      # `tsc -b`, not `tsc --noEmit` — the same command `npm run build` runs.
      # --noEmit uses the root tsconfig, which does NOT include vite.config.ts
      # or the other node-side files; -b builds every referenced project. The
      # difference is not theoretical: a type error in vite.config.ts passed
      # --noEmit locally and then failed the deploy build in this very PR.
      - name: Type check
        run: npx tsc -b
      - name: Test
        run: npm test

  functions:
    name: Cloud Functions (syntax + offline suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      # Cheap, and it is the check that would have caught a bad edit to a
      # 5,000-line file before anything else ran.
      - name: Syntax check every function module
        run: |
          set -e
          for f in functions/*.js; do node --check "$f"; done
          echo "syntax OK: $(ls functions/*.js | wc -l) modules"

      # Loading the entry point is what `firebase deploy` does first. A require
      # that does not resolve fails the whole deploy for every function in the
      # codebase, not just the one that is broken.
      - name: Entry point loads
        run: node -e "process.env.GCLOUD_PROJECT='ci'; require('./functions/index.js'); console.log('index.js loaded')"

      - name: Offline test suites
        run: |
          set -e
          fail=0
          for t in functions/test/*.test.mjs; do
            echo "--- $t"
            node "$t" || fail=1
          done
          exit $fail
