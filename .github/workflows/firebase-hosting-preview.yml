name: Preview Deploy (PR)

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '**.md'
      - 'docs/**'

permissions:
  checks: write
  pull-requests: write

jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 20, NOT the runner default (22.23+): firebase-tools
      # (action-hosting-deploy) hits an undici "Premature close" on the OAuth
      # token fetch on Node 22.23+ -> "Failed to authenticate". Node 20 works.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ตัดช่องเก่าก่อนสร้างช่องใหม่ — เหตุผลและกติกาทั้งหมดอยู่ในหัวสคริปต์
      # best-effort: การตัดช่องต้องไม่ทำให้ build ล้ม (continue-on-error)
      - name: Prune stale preview channels (admin)
        continue-on-error: true
        env:
          SITE: bkk-apple-admin
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BKK_APPLE_TRADEIN }}
        run: bash scripts/prune-preview-channels.sh

      - name: Build project
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BKK_APPLE_TRADEIN }}
          projectId: bkk-apple-tradein
          target: admin
          # Shorten the preview-channel lifetime from the 7d default to 1d.
          # Firebase Hosting limits ~50 preview channels per site; with the
          # PR cadence in this repo we hit RESOURCE_EXHAUSTED (HTTP 429)
          # repeatedly. 1d still covers the typical review-then-merge
          # window — we squash-merge fast and don't keep PR previews
          # around. Anything still relevant after a day can re-trigger
          # by pushing a new commit.
          expires: 1d

  # ── แอปพนักงาน (employee-app/, site แยก) ────────────────────────────────
  #
  # **แยกเป็น job ของตัวเอง ไม่ใช่ต่อท้าย job บน** ด้วยสองเหตุผล:
  # 1. `action-hosting-deploy` โพสต์คอมเมนต์ลิงก์ preview ลง PR และหาคอมเมนต์
  #    เดิมของตัวเองจากบริบทของ job — เรียกสองครั้งใน job เดียวเสี่ยงให้ใบที่สอง
  #    ทับใบแรก แล้วลิงก์ของแอปแอดมินหายไปเงียบๆ
  # 2. แอปคนละตัวไม่ควรล้มพร้อมกัน และหน้า PR ควรเห็นเป็นคนละช่อง
  #
  # ที่มา: ก่อนหน้านี้ workflow นี้ deploy `target: admin` ตัวเดียว แปลว่า
  # **PR ที่แก้หน้าตาแอปพนักงานทุกใบเปิดดูด้วยตาก่อน merge ไม่ได้เลย** ต้องรอ
  # merge แล้วดูบน production ซึ่งขัดกับบทเรียนของโปรเจกต์เอง (บั๊กใบเสร็จ
  # 2 ใน 3 ตัวถูกจับด้วยการกดดูจริง ขณะที่ CI เขียวครบทุกช่อง)
  preview-employee:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 20 ด้วยเหตุผลเดียวกับ job บน (firebase-tools + undici บน 22.23+)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # **ต้อง `npm ci` ที่ราก ไม่ใช่แค่ใน employee-app/** — `employee-app/
      # tsconfig.json` ประกาศ `types: ["vite/client", "vitest/globals"]` แต่
      # `vitest` เป็น dependency ของ **แพ็กเกจราก** ไม่ใช่ของแอปพนักงาน
      # (แอปนี้ไม่ได้รันเทสเอง เทสถูกรันจากรากผ่าน vitest.config.ts) ถ้าไม่มี
      # node_modules ที่ราก `tsc -b` จะล้มด้วย TS2688 "Cannot find type
      # definition file for 'vitest/globals'" ตั้งแต่ขั้น build
      # (เจอจริงตอนเพิ่ม job นี้ครั้งแรก — reproduce ในเครื่องแล้วได้ error
      # เดียวกันเป๊ะโดยการซ่อน node_modules/vitest ที่ราก)
      # ทั้ง firebase-hosting-deploy.yml และ ci.yml ก็ `npm ci` ที่รากก่อน
      # build แอปพนักงานด้วยเหตุผลเดียวกันนี้
      - run: npm ci

      - name: Prune stale preview channels (employee)
        continue-on-error: true
        env:
          SITE: bkk-apple-employee
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BKK_APPLE_TRADEIN }}
        run: bash scripts/prune-preview-channels.sh

      # site อาจยังไม่มีถ้า deploy หลักยังไม่เคยรัน — best-effort เหมือน
      # ขั้นตอนเดียวกันใน firebase-hosting-deploy.yml
      - name: Ensure employee hosting site exists
        continue-on-error: true
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BKK_APPLE_TRADEIN }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx firebase-tools@13 hosting:sites:create bkk-apple-employee \
            --project bkk-apple-tradein || echo "site exists or create not permitted — continuing"
          rm -f "$RUNNER_TEMP/firebase-sa.json"

      - name: Build employee app
        run: cd employee-app && npm ci && npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # **ตัวนี้ไม่ใส่ continue-on-error โดยตั้งใจ** — deploy ที่ล้มเงียบๆ คือ
      # preview ที่ไม่มีใครรู้ว่าไม่มีอยู่ ซึ่งแย่กว่าช่องแดงหนึ่งช่อง
      # (ขั้น prune กับ site-create ข้างบนเป็น best-effort ตามแบบเดิม)
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BKK_APPLE_TRADEIN }}
          projectId: bkk-apple-tradein
          target: employee
          expires: 1d
